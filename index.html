<body>
    <header>
        <a href="/" class="brand">
            <img src="https://biggbde.fr/assets/favicons/web-app-manifest-512x512.png" alt="Logo BIGG BDE">
            <h1>BIGG BDE</h1>

        <nav>
            <a href="https://biggbde.fr/">Le site WEB</a>
            <a href="/contact/" class="nav-contact-btn">Contact</a>
        </nav>
    </header>

    <main>
        <div class="hero">
            <h2>Annuaire des Adhérents</h2>
            <p>Saison 2026-2027</p>
            
            <input type="text" id="searchInput" placeholder="Rechercher un adhérent (nom, prénom, filière)...">
            
            <!-- Nouveaux filtres ajoutés ici -->
            <div class="filters">
                <select id="filterFiliere">
                    <option value="all">Toutes les filières</option>
                </select>
                
                <select id="filterAnnee">
                    <option value="all">Toutes les années</option>
                </select>

                <select id="sortOrder">
                    <option value="nom_asc">Nom (A à Z)</option>
                    <option value="nom_desc">Nom (Z à A)</option>
                    <option value="prenom_asc">Prénom (A à Z)</option>
                    <option value="prenom_desc">Prénom (Z à A)</option>
                </select>

                <button id="resetBtn">Réinitialiser</button>
            </div>
        </div>

        <div id="membersGrid" class="grid"></div>
    </main>

    <footer>
        <div class="footer-links">
            <a href="/mentions-legales/">Mentions Légales</a>
            <a href="/2026-2027/ADH_BIGG_26-27.xlsx" download>Fichier ADH</a>
        </div>
        <div class="footer-socials">
            <span><a href="https://www.instagram.com/bigg_bde" target="_blank">Instagram</a></span>
            <span><a href="https://www.facebook.com/profile.php?id=61569855328651" target="_blank">Facebook</a></span>
            <span><a href="https://www.tiktok.com/@biggbde" target="_blank">Tiktok</a></span>
        </div>
        
        <button id="scrollTopBtn" onclick="scrollToTop()" title="Remonter en haut">
            <img src="https://biggbde.fr/assets/svg/angle-up-svgrepo-com.svg" alt="Angled Up Arrow SVG ; AUTHOR: FortAwesome" class="scroll-icon">
        </button>
    </footer>

    <script>
        const searchInput = document.getElementById('searchInput');
        const filterFiliere = document.getElementById('filterFiliere');
        const filterAnnee = document.getElementById('filterAnnee');
        const sortOrder = document.getElementById('sortOrder');
        const resetBtn = document.getElementById('resetBtn');
        const grid = document.getElementById('membersGrid');

        // Remplir dynamiquement la liste des filières basées sur data.js
        const uniqueFilieres = [...new Set(members.map(m => m.filiere))].filter(Boolean).sort();
        uniqueFilieres.forEach(f => {
            const opt = document.createElement('option');
            opt.value = f;
            opt.textContent = f;
            filterFiliere.appendChild(opt);
        });

        // Remplir dynamiquement la liste des années basées sur data.js
        const uniqueAnnees = [...new Set(members.map(m => m.annee))].filter(Boolean).sort();
        uniqueAnnees.forEach(a => {
            const opt = document.createElement('option');
            opt.value = a;
            opt.textContent = a;
            filterAnnee.appendChild(opt);
        });

        function renderMembers() {
            grid.innerHTML = '';
            
            const query = searchInput.value.toLowerCase();
            const selectedFiliere = filterFiliere.value;
            const selectedAnnee = filterAnnee.value;
            const selectedSort = sortOrder.value;

            // 1. Filtrer
            let filtered = members.filter(m => {
                const text = `${m.prenom} ${m.nom} ${m.filiere} ${m.annee} ${m.id}`.toLowerCase();
                const matchSearch = text.includes(query);
                const matchFiliere = (selectedFiliere === 'all' || m.filiere === selectedFiliere);
                const matchAnnee = (selectedAnnee === 'all' || m.annee === selectedAnnee);
                
                return matchSearch && matchFiliere && matchAnnee;
            });

            // 2. Trier (avec localeCompare pour gérer les accents)
            filtered.sort((a, b) => {
                if (selectedSort === 'nom_asc') return (a.nom || '').localeCompare(b.nom || '', 'fr');
                if (selectedSort === 'nom_desc') return (b.nom || '').localeCompare(a.nom || '', 'fr');
                if (selectedSort === 'prenom_asc') return (a.prenom || '').localeCompare(b.prenom || '', 'fr');
                if (selectedSort === 'prenom_desc') return (b.prenom || '').localeCompare(a.prenom || '', 'fr');
                return 0;
            });

            // 3. Afficher
            if (filtered.length === 0) {
                grid.innerHTML = '<p style="text-align:center; width:100%; color:var(--gray); grid-column: 1 / -1;">Aucun adhérent trouvé.</p>';
                return;
            }

            filtered.forEach(m => {
                const card = document.createElement('a');
                card.href = `2026-2027/${m.id}/`;
                card.className = 'member-card';
                const displayName = m.nom ? `${m.prenom} ${m.nom}` : m.prenom;
                
                card.innerHTML = `
                    <h3>${displayName}</h3>
                    <p class="filiere">${m.filiere} ${m.annee ? '- ' + m.annee : ''}</p>
                    <p class="id-tag">${m.displayId || m.id}</p>
                `;
                grid.appendChild(card);
            });
        }

        // Écouteurs d'événements pour actualiser en direct
        searchInput.addEventListener('input', renderMembers);
        filterFiliere.addEventListener('change', renderMembers);
        filterAnnee.addEventListener('change', renderMembers);
        sortOrder.addEventListener('change', renderMembers);

        // Bouton Réinitialiser
        resetBtn.addEventListener('click', () => {
            searchInput.value = '';
            filterFiliere.value = 'all';
            filterAnnee.value = 'all';
            sortOrder.value = 'nom_asc';
            renderMembers();
        });

        // Premier affichage au chargement de la page
        renderMembers();
    </script>
</body>
